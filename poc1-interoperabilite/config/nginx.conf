# Point d'entrée unique du démonstrateur : la page web et tous les services
# sont servis sous la même origine (pas de problème CORS, un seul port ouvert).
server {
    listen 80;
    server_name _;
    server_tokens off;            # ne pas divulguer la version de nginx

    # En-têtes de sécurité de base (OWASP Secure Headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Services de lecture seule exposés au public. L'interface d'administration
    # et l'API REST de GeoServer ne sont PAS relayées (accès local uniquement).
    location /geoserver/web/  { return 403; }
    location /geoserver/rest/ { return 403; }
    location /geoserver/ {
        proxy_pass http://geoserver:8080/geoserver/;
        proxy_set_header Host $host;
        limit_except GET HEAD { deny all; }
    }

    location /catalogue/ {
        proxy_pass http://catalogue:80/;
        proxy_set_header Host $host;
        limit_except GET HEAD { deny all; }
    }

    # Producteur simulé : dans la réalité, ce service est hébergé par
    # l'institution productrice ; il est relayé ici pour la démonstration.
    location /producteur/ {
        proxy_pass http://producteur:80/;
        proxy_set_header Host $host;
        limit_except GET HEAD { deny all; }
    }
}
