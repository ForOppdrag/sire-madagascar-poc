# Catalogue du SIRE : OGC API - Records (pygeoapi + TinyDB).
# Chaque fiche décrit un jeu de données et son niveau d'intégration
# (0 catalogué … 4 référence).
server:
  bind:
    host: 0.0.0.0
    port: 80
  url: ${CATALOGUE_URL}
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  languages:
    - fr-FR
  cors: true
  pretty_print: true
  limits:
    default_items: 50
    max_items: 500
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; contributeurs OpenStreetMap'

logging:
  level: ERROR

metadata:
  identification:
    title:
      fr: Catalogue de données du SIRE (démonstrateur)
    description:
      fr: Catalogue OGC API - Records des jeux de données recensés et de leur niveau d'intégration
    keywords:
      fr:
        - catalogue
        - eau
        - SIRE
    keywords_type: theme
    terms_of_service: https://creativecommons.org/licenses/by/4.0/
    url: https://example.org
  license:
    name: CC-BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  provider:
    name: Démonstrateur SIRE
    url: https://example.org
  contact:
    name: Équipe POC SIRE
    position: Démonstrateur
    address: Antananarivo
    city: Antananarivo
    stateorprovince: Analamanga
    postalcode: '101'
    country: Madagascar
    email: contact@example.org
    url: https://example.org
    role: pointOfContact

resources:
  jeux_donnees:
    type: collection
    title:
      fr: Jeux de données recensés
    description:
      fr: Fiches de métadonnées des jeux de données du SIRE
    keywords:
      fr:
        - métadonnées
    links:
      - type: text/html
        rel: canonical
        title: Documentation du POC
        href: https://example.org
    extents:
      spatial:
        bbox: [43.0, -25.8, 50.7, -11.8]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: record
        name: TinyDBCatalogue
        data: /data/catalogue.tinydb
        id_field: id
        time_field: recordCreated
        title_field: title
